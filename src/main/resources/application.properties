spring.application.name=benchmarks

server.port=18080

# Esquema recreado en cada arranque e cargado cos datos de proba (src/main/resources/sql)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
# Os bancos sen valoracións (nota media null) van ao final ao ordenar
spring.jpa.properties.hibernate.order_by.default_null_ordering=last
# Tamaño máximo de páxina nas coleccións
spring.data.web.pageable.max-page-size=100
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/auth.sql,classpath:sql/users.sql,classpath:sql/benches.sql,classpath:sql/reviews.sql,classpath:sql/comments.sql,classpath:sql/social.sql

spring.datasource.url=jdbc:postgresql://localhost:15432/benchMarks
spring.datasource.username=admin
spring.datasource.password=admin

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Caché distribuída en Redis (TTL por defecto; as cachés concretas configúranse en CacheConfiguration)
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.key-prefix=benchmarks::

spring.jackson.serialization.indent-output=true
spring.jackson.mapper.default-view-inclusion=true

# Subida de fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

auth.jwt.ttl=PT15M
auth.refresh.ttl=P7D

keystore.password=123456789
keystore.private.name=jwt
keystore.private.password=123456789

springdoc.swagger-ui.path=/docs/swagger
springdoc.api-docs.path=/docs/oas
scalar.path=/docs/scalar

spring.docker.compose.enabled=true

# Servizo externo de meteoroloxía usado para calcular a sombra dos bancos
benchmarks.weather.base-url=https://api.open-meteo.com/v1/forecast
benchmarks.weather.timeout=PT3S
benchmarks.timezone=Europe/Madrid
